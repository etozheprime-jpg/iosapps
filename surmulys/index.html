<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Šurmulys">
<meta name="description" content="Šurmulys — концерты, спектакли, выставки и фестивали Вильнюса. Список на сегодня обновляется сам.">
<title>Šurmulys — события Вильнюса</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="wrap">
  <header class="hero">
    <div class="eyebrow"><span class="dot"></span><span id="today-label">Vilnius</span></div>
    <h1 class="logo" aria-label="Šurmulys"><span>Š</span><span>u</span><span>r</span><span>m</span><span>u</span><span>l</span><span>y</span><span>s</span></h1>
    <p class="tag">Что происходит в Вильнюсе — каждый день, само.</p>

    <div class="stats" id="stats">
      <div class="stat"><b data-count="0" id="n-today">0</b><span>сегодня</span></div>
      <div class="stat"><b data-count="0" id="n-week">0</b><span>на неделе</span></div>
      <div class="stat"><b data-count="0" id="n-all">0</b><span>всего</span></div>
    </div>
  </header>

  <section class="controls" aria-label="Фильтры">
    <div class="seg" role="tablist" id="range">
      <button role="tab" data-range="today" class="on">Сегодня</button>
      <button role="tab" data-range="tomorrow">Завтра</button>
      <button role="tab" data-range="week">7 дней</button>
      <button role="tab" data-range="all">Все</button>
    </div>
    <label class="search"><span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Поиск: артист, зал, жанр…" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Категории"></div>
  </section>

  <section id="list" class="list" aria-live="polite"></section>

  <section id="empty" class="empty" hidden>
    <div class="orb" aria-hidden="true"></div>
    <h2 id="empty-title">Пока пусто</h2>
    <p id="empty-text"></p>
  </section>

  <footer class="foot">
    <div class="foot-row">
      <span id="updated">Загружаю…</span>
      <button id="btn-refresh" class="ghost" type="button">Обновить</button>
    </div>
    <div class="foot-row">
      <button id="btn-digest" class="ghost" type="button">🔔 Сводка дня</button>
      <button id="btn-install" class="ghost" type="button" hidden>⤓ Установить</button>
    </div>
    <p class="src" id="sources"></p>
  </footer>
</main>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
