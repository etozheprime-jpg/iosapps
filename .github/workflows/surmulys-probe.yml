name: Šurmulys — probe
on:
  workflow_dispatch:
  push:
    paths: ['surmulys/tools/probe.mjs', '.github/workflows/surmulys-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node surmulys/tools/probe.mjs
        env:
          URLS: >-
            https://allevents.in/vilnius/music
            https://allevents.in/vilnius/performing-arts
            https://allevents.in/vilnius/all
            https://allevents.in/vilnius/RSS
            https://www.tiketa.lt/LT/Event/5379
            https://www.tiketa.lt/LT/nuotaika_lt_renginiai_709
            https://www.bilietai.lt/renginiai/koncertai
            https://www.bilietai.lt/renginiai/visi
            https://www.bilietai.lt/renginiai/teatras
            https://www.filharmonija.lt/repertuaras/koncertai-vilniuje/53
            https://www.govilnius.lt/visit-vilnius/events-vilnius
            https://www.mo.lt/renginiai/
