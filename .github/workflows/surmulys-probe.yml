name: Šurmulys — probe
on:
  workflow_dispatch:
  push:
    paths: ['surmulys/tools/probe.mjs', '.github/workflows/surmulys-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node surmulys/tools/probe.mjs
        env:
          URLS: >-
            https://www.vilnius-events.lt/renginiai/banchetto-musicale-tarptautinis-senosios-muzikos-festivalis-2026/@@startDate|"Event"|data-date|date
            https://www.vilnius-events.lt/wp-json/wp/v2/types@@HEAD
            https://www.vilnius-events.lt/feed/@@HEAD
            https://www.bilietai.lt/renginiai/PSEYOS2ASK/vilniaus-rytas-rungtyniu-abonementas@@"@type"\s*:\s*"[A-Za-z]*Event"
            https://www.bilietai.lt/series/O75TMBRU7Q/chris-norman-band-koncertas@@"@type"\s*:\s*"[A-Za-z]*Event"
            https://allevents.in/vilnius/candlelight-geriausi-hans-zimmer-k%C5%ABriniai/2700030035755043@@startDate
            https://allevents.in/rss3.php?city=vilnius&category=music@@HEAD
