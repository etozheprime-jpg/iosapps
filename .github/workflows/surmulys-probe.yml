name: Šurmulys — probe
on:
  workflow_dispatch:
  push:
    paths: ['surmulys/tools/probe.mjs', '.github/workflows/surmulys-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node surmulys/tools/probe.mjs
        env:
          URLS: >-
            https://allevents.in/vilnius/RSS@@HEAD
            https://allevents.in/vilnius@@"@type":\s*"Event"
            https://www.tiketa.lt/LT/Event/5379@@2026-10-23T18:00
            https://www.vilnius-events.lt/@@HEAD
            https://www.vilnius-events.lt/lt/renginiai/@@HEAD
            https://www.govilnius.lt/renginiai-vilniuje@@HEAD
